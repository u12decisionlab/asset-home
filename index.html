<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="資産管理">
<meta name="theme-color" content="#1f3864">
<title>夫婦の資産管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3864'/%3E%3Cpath d='M14 46h36M20 40V30M30 40V22M40 40V26M50 40V16' stroke='%23e8c25a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --navy:#1f3864; --navy2:#2e5395; --gold:#d4a017; --gold2:#e8c25a;
  --bg:#f3f4f7; --card:#ffffff; --ink:#1b2133; --ink2:#4d5568; --muted:#7c8496;
  --line:#e3e6ec; --grid:#eceef2; --plus:#1e8e5a; --minus:#c8372d;
  --c-invest:#2e5395; --c-cash:#d4a017; --c-3:#2a9d8f; --c-4:#9b6bc4;
  --c-target:#7c8496; --chip:#e9edf5; --input:#f7f8fa;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318; --card:#1b1e25; --ink:#eef0f5; --ink2:#b8bdca; --muted:#8a90a0;
    --line:#2c303a; --grid:#262a33; --plus:#4cc38a; --minus:#ff7a6e;
    --c-invest:#5b84d6; --c-cash:#a8841f; --c-3:#2ba496; --c-4:#a57fd4;
    --c-target:#8a90a0; --chip:#262b36; --input:#14161b;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-text-size-adjust:100%;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* header */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 18px}
.hero .ttl{font-size:13px;opacity:.85;display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:32px;font-weight:700;letter-spacing:.5px;margin:2px 0 6px}
.hero .sub{font-size:13px;opacity:.9}
.hero .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold2);border-radius:4px}
.reload{background:rgba(255,255,255,.15);border:0;border-radius:999px;color:#fff;padding:4px 10px;font-size:12px}

main{padding:14px 14px calc(env(safe-area-inset-bottom) + 86px);max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 4px}
.card .note{font-size:12px;color:var(--muted);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.chart{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:0;border-top:2px solid;display:inline-block}
.legend .ln.dash{border-top-style:dashed}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:12px}
th:first-child,td:first-child{text-align:left}
td .cat{font-size:11px;color:var(--muted)}
tfoot td{font-weight:700;border-bottom:0}

/* input */
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:12px}
.status.done{background:color-mix(in srgb,var(--plus) 14%,transparent);color:var(--plus)}
.status.todo{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.on{background:var(--navy2);color:#fff}
.chip.now{outline:2px solid var(--gold);outline-offset:1px}
.group-h{font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 6px;display:flex;justify-content:space-between}
.row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.row .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px}
.row .nm small{font-weight:400;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:11px;color:var(--muted)}
.yen{position:relative}
.yen > input{padding-right:30px !important}
.yen::after{content:"円";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.pct::after{content:"%"}
input[type=text],input[type=number],input[type=password],input[type=date],select{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--input);
  font-size:16px;text-align:right;-webkit-appearance:none;appearance:none}
input.left,select{text-align:left}
input::placeholder{color:var(--muted);opacity:1}
input:focus,select:focus{outline:2px solid var(--navy2);outline-offset:-1px}
.del{border:0;background:none;color:var(--minus);font-size:12px;padding:4px 6px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;
  background:var(--navy2);color:#fff;margin-top:10px}
.btn.gold{background:var(--gold);color:#1b1b1b}
.btn.ghost{background:transparent;color:var(--navy2);border:1px dashed var(--navy2);font-weight:600;padding:10px}
.btn:disabled{opacity:.5}
.total-line{display:flex;justify-content:space-between;font-weight:700;padding:8px 2px 0;font-size:14px}
.set-row{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;padding:6px 0}
.set-row .lb{font-size:14px}
.set-row .lb small{display:block;font-size:11px;color:var(--muted)}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:10.5px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--navy2)}
@media (prefers-color-scheme: dark){nav.tabs button.on{color:var(--gold2)}}

/* overlay */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;
  transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--minus);color:#fff}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:40}
.busy.show{display:flex}
.busy div{background:var(--card);padding:16px 22px;border-radius:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--navy2);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gate{max-width:420px;margin:12vh auto 0;padding:0 18px}
.gate p{color:var(--ink2);font-size:14px}
.gate input{text-align:left}
.empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details.tbl summary{font-size:12px;color:var(--navy2);cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy"><div><span class="spin"></span><span id="busyText">読み込み中…</span></div></div>

<script>
'use strict';
// ===== 設定 =====
const API = 'https://script.google.com/macros/s/AKfycbzjxfSIXy5CjbfkSkjsjqaPKwG6ndCYKPTKPIGTAmyrTgHGlPYBSTFucoDluu6ZCJikuQ/exec';
const KEY_STORE = 'assetHome.key';
const APP_VERSION = '2026-10-19.8';
const CATEGORY_ORDER = ['国内株式','投資信託(成長)','投資信託(つみたて)','米国株式等'];

// ===== 小道具 =====
const $ = s => document.querySelector(s);
const yen = n => Math.round(Number(n) || 0).toLocaleString('ja-JP') + '円';
const man = n => { const v = (Number(n)||0)/10000; return (Math.abs(v)>=100 ? Math.round(v).toLocaleString('ja-JP') : v.toFixed(1)) + '万円'; };
const pct = (n, d=1) => ((Number(n)||0)*100).toFixed(d) + '%';
const signed = (n, f=yen) => (n>0?'+':n<0?'−':'±') + f(Math.abs(n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v).replace(/[,，円\s]/g,'')); return Number.isFinite(n) ? n : 0; };
const ym = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const ymLabel = id => { const [y,m] = id.split('-'); return `${y}年${Number(m)}月`; };
const addMonths = (id, k) => { const [y,m] = id.split('-').map(Number); return ym(new Date(y, m-1+k, 1)); };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sum = (a, f) => a.reduce((s,x) => s + (Number(f(x))||0), 0);

let toastTimer;
function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err?' err':'');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', err?4500:2500);
}
function busy(on, text='読み込み中…'){ $('#busyText').textContent = text; $('#busy').classList.toggle('show', on); }

// ===== キー =====
function readKeyFromHash(){
  const m = location.hash.match(/key=([^&]+)/);
  if (m){
    try { localStorage.setItem(KEY_STORE, decodeURIComponent(m[1])); } catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
  }
}
function getKey(){ try { return localStorage.getItem(KEY_STORE) || ''; } catch(e){ return ''; } }
function setKey(k){ try { localStorage.setItem(KEY_STORE, k); } catch(e){} }
function clearKey(){ try { localStorage.removeItem(KEY_STORE); } catch(e){} }

// ===== API =====
async function apiGet(key){
  const res = await fetch(`${API}?key=${encodeURIComponent(key)}&t=${Date.now()}`, {redirect:'follow'});
  if (!res.ok) throw new Error('通信エラー (' + res.status + ')');
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j;
}
async function apiPost(body){
  const res = await fetch(API, {method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({...body, key:getKey()})});
  if (!res.ok) throw new Error('通信エラー (' + res.status + ')');
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  if (!j.ok) throw new Error('保存に失敗しました');
  return j;
}

// ===== 状態 =====
const S = { data:null, tab:'home', draft:null, dirty:false, charts:[], inputMonth:null };

function normalize(d){
  d.cash = (d.cash||[]).map(c => ({...c, value:num(c.value)}));
  d.holdings = (d.holdings||[]).map(h => ({...h, value:num(h.value), cost:num(h.cost)}));
  const byId = {};
  (d.snapshots||[]).forEach(s => { const id = String(s.id).slice(0,7); byId[id] = {...s, id, cash:num(s.cash), invest:num(s.invest)}; });
  d.snapshots = Object.values(byId).sort((a,b) => a.id < b.id ? -1 : 1);
  d.assumptions = d.assumptions || {};
  return d;
}
function bonusMonths(a){
  const v = a.bonusMonths;
  return (Array.isArray(v) ? v : String(v ?? '').split(/[,、\s]+/)).map(Number).filter(n => n>=1 && n<=12);
}
function totals(d=S.data){
  const cash = sum(d.cash, c => c.value), invest = sum(d.holdings, h => h.value);
  return {cash, invest, total:cash+invest};
}
function dateStr(v){ const t = String(v || ''); if (/T/.test(t)){ const d = new Date(t); if (!isNaN(d)) return ym(d) + '-' + String(d.getDate()).padStart(2,'0'); } return t.slice(0,10); }
function startId(a){ return dateStr(a.startDate).slice(0,7) || (S.data.snapshots[0]?.id) || ym(new Date()); }

// ===== 予測計算 =====
function project(a, from, months, withDips){
  const mi = Math.pow(1 + num(a.returnRate), 1/12) - 1;
  const mc = Math.pow(1 + num(a.cashRate), 1/12) - 1;
  const fixed = num(a.fixedSP500) + num(a.fixedNASDAQ);
  const cap = num(a.cashCap), bm = bonusMonths(a);
  const dipEvery = Math.round(num(a.dipEveryYears) * 12), dip = num(a.dipAmount);
  const sid = startId(a);
  let cash = from.cash, inv = from.invest;
  const out = [];
  for (let k = 1; k <= months; k++){
    const id = addMonths(from.id, k), m = Number(id.slice(5));
    cash *= 1 + mc; inv *= 1 + mi;
    let surplus = num(a.husbandIncome) + num(a.wifeIncome) - num(a.monthlyExpense);
    if (bm.includes(m)) surplus += num(a.bonus);
    inv += fixed;                               // 固定積立は最優先
    const rest = surplus - fixed;
    if (rest >= 0){
      const toCash = cash < cap ? Math.min(rest, cap - cash) : 0;
      cash += toCash; inv += rest - toCash;
    } else {
      cash += rest;                             // 足りない分は現金から
    }
    if (withDips && dipEvery > 0 && dip > 0){
      const since = monthsBetween(sid, id);
      if (since > 0 && since % dipEvery === 0) cash -= dip;
    }
    if (cash < 0){ inv += cash; cash = 0; }     // 現金が足りなければ投資から
    out.push({id, cash, invest:inv, total:cash+inv});
  }
  return out;
}
function monthsBetween(a, b){ const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); }

// ===== 起動 =====
// 新しい版が公開されていたら自動で読み直す（ブラウザが古い版を覚えているとき用）
async function checkUpdate(){
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem('assetHome.reloaded') !== m[1]){
      sessionStorage.setItem('assetHome.reloaded', m[1]);
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + location.hash);
    }
  } catch(e){}
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
readKeyFromHash();
window.addEventListener('hashchange', () => { if (/key=/.test(location.hash)){ readKeyFromHash(); boot(); } });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.data && render());
window.addEventListener('beforeunload', e => { if (S.dirty){ e.preventDefault(); e.returnValue=''; } });
boot();

async function boot(){
  const key = getKey();
  if (!key) return renderGate();
  busy(true);
  try {
    S.data = normalize(await apiGet(key));
    S.draft = null; S.dirty = false;
    renderTabs(); render();
  } catch(e){
    renderGate(e.message);
  } finally { busy(false); }
}
async function reload(msg){
  busy(true);
  try { S.data = normalize(await apiGet(getKey())); S.draft = null; S.dirty = false; render(); if (msg) toast(msg); }
  catch(e){ toast('再読み込み失敗：' + e.message, true); }
  finally { busy(false); }
}

function renderGate(err){
  $('#tabs').hidden = true;
  destroyCharts();
  $('#app').innerHTML = `
  <div class="gate">
    <h1 style="font-size:22px;margin:0 0 6px">夫婦の資産管理</h1>
    <p>共有されたアクセスキーを入力してください。この端末に保存され、次回からは入力不要です。</p>
    <form id="gateForm">
      <input id="gateKey" type="password" class="left" autocomplete="current-password" placeholder="アクセスキー" required>
      <button class="btn" type="submit">開く</button>
    </form>
    ${err ? `<p class="minus" style="margin-top:12px">読み込めませんでした：${esc(err)}</p>` : ''}
  </div>`;
  $('#gateForm').onsubmit = e => { e.preventDefault(); setKey($('#gateKey').value.trim()); boot(); };
}

// ===== タブ =====
const TABS = [
  ['home','ホーム','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
  ['portfolio','内訳','<circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 5"/>'],
  ['trend','推移','<path d="M3 20h18M5 16l5-5 4 3 6-7"/>'],
  ['input','月次入力','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'],
  ['exit','出口戦略','<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'],
  ['settings','設定','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'],
];
function renderTabs(){
  const nav = $('#tabs'); nav.hidden = false;
  nav.innerHTML = TABS.map(([id,lb,ic]) =>
    `<button data-tab="${id}" class="${S.tab===id?'on':''}" aria-label="${lb}"><svg viewBox="0 0 24 24">${ic}</svg>${lb}</button>`).join('');
  nav.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    S.tab = b.dataset.tab;
    nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
    render(); window.scrollTo(0,0);
  };
}

// ===== グラフ共通 =====
function destroyCharts(){ S.charts.forEach(c => c.destroy()); S.charts = []; }
function themeChart(){
  if (!window.Chart) return;
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 11;
  Chart.defaults.color = cssVar('--ink2');
  Chart.defaults.borderColor = cssVar('--grid');
  Chart.defaults.plugins.legend.display = false;
  Chart.defaults.plugins.tooltip.backgroundColor = cssVar('--ink');
  Chart.defaults.plugins.tooltip.titleColor = cssVar('--card');
  Chart.defaults.plugins.tooltip.bodyColor = cssVar('--card');
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.boxPadding = 4;
  Chart.defaults.maintainAspectRatio = false;
}
function mkChart(id, cfg){
  const el = document.getElementById(id);
  if (!el || !window.Chart) { if (el) el.parentElement.innerHTML = '<div class="empty">グラフを読み込めませんでした（通信を確認してください）</div>'; return; }
  S.charts.push(new Chart(el, cfg));
}
const yenTip = ctx => ` ${ctx.dataset.label || ctx.label}：${yen(ctx.parsed.y ?? ctx.parsed.x ?? ctx.parsed)}`;
const manTick = v => man(v);
const COL = () => ({invest:cssVar('--c-invest'), cash:cssVar('--c-cash'), c3:cssVar('--c-3'), c4:cssVar('--c-4'),
  target:cssVar('--c-target'), card:cssVar('--card'), plus:cssVar('--plus'), minus:cssVar('--minus'), muted:cssVar('--muted')});
const legendHTML = items => `<div class="legend">${items.map(([c,l,t]) =>
  t ? `<span><i class="ln ${t}" style="border-color:${c}"></i>${esc(l)}</span>` : `<span><i class="dot" style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
function donut(id, labels, values, colors){
  mkChart(id, {type:'doughnut', data:{labels, datasets:[{data:values, backgroundColor:colors, borderColor:COL().card, borderWidth:2}]},
    options:{cutout:'62%', plugins:{tooltip:{callbacks:{label:ctx => {
      const t = ctx.dataset.data.reduce((a,b)=>a+b,0); return ` ${ctx.label}：${yen(ctx.parsed)}（${pct(ctx.parsed/t)}）`; }}}}}});
}

// ===== 描画 =====
function render(){
  destroyCharts(); themeChart();
  const v = {home:viewHome, portfolio:viewPortfolio, trend:viewTrend, input:viewInput, exit:viewExit, settings:viewSettings}[S.tab];
  v();
}

function heroHTML(){
  const t = totals(), a = S.data.assumptions, goal = num(a.goal);
  const rate = goal ? t.total/goal : 0;
  return `<header class="hero">
    <div class="ttl"><span>総資産</span><button class="reload" id="reloadBtn">↻ 更新</button></div>
    <div class="big num">${yen(t.total)}</div>
    <div class="sub num">目標 ${man(goal)} に対して <b>${pct(rate)}</b> 達成</div>
    <div class="bar" role="progressbar" aria-valuenow="${(rate*100).toFixed(1)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,rate*100)}%"></i></div>
  </header>`;
}
function bindHero(){ const b = $('#reloadBtn'); if (b) b.onclick = () => reload('最新の状態に更新しました'); }

function prevSnapshot(){
  const snaps = S.data.snapshots, cur = ym(new Date());
  const past = snaps.filter(s => s.id < cur);
  return past[past.length-1] || null;
}

function viewHome(){
  const t = totals(), a = S.data.assumptions, goal = num(a.goal), C = COL();
  const p = prevSnapshot();
  const d = (now, before) => p ? `<div class="d num ${now-before>=0?'plus':'minus'}">${ymLabel(p.id)}比 ${signed(now-before)}</div>` : '<div class="d">前月の記録なし</div>';
  const snaps = S.data.snapshots.slice(-8);
  $('#app').innerHTML = heroHTML() + `<main>
    <div class="grid2">
      <div class="kpi"><div class="k">総資産</div><div class="v num">${man(t.total)}</div>${d(t.total, p ? p.cash+p.invest : 0)}</div>
      <div class="kpi"><div class="k">目標金額</div><div class="v num">${man(goal)}</div><div class="d num">あと ${man(Math.max(0,goal-t.total))}</div></div>
      <div class="kpi"><div class="k"><i class="dot" style="background:${C.cash}"></i>現金 ${pct(t.cash/(t.total||1))}</div><div class="v num">${man(t.cash)}</div>${d(t.cash, p?.cash||0)}</div>
      <div class="kpi"><div class="k"><i class="dot" style="background:${C.invest}"></i>投資 ${pct(t.invest/(t.total||1))}</div><div class="v num">${man(t.invest)}</div>${d(t.invest, p?.invest||0)}</div>
    </div>
    <section class="card"><h2>現金と投資の割合</h2>
      ${legendHTML([[C.cash,`現金 ${pct(t.cash/(t.total||1))}`],[C.invest,`投資 ${pct(t.invest/(t.total||1))}`]])}
      <div class="chart" style="height:200px"><canvas id="cHomeDonut" aria-label="現金と投資の割合"></canvas></div>
    </section>
    <section class="card"><h2>総資産の推移</h2><p class="note">記録がある月だけ表示（直近${snaps.length}か月）</p>
      ${snaps.length ? '<div class="chart" style="height:200px"><canvas id="cHomeLine" aria-label="総資産の推移"></canvas></div>' : '<div class="empty">まだ記録がありません</div>'}
    </section>
  </main>`;
  bindHero();
  donut('cHomeDonut', ['現金','投資'], [t.cash, t.invest], [C.cash, C.invest]);
  if (snaps.length) mkChart('cHomeLine', {type:'line',
    data:{labels:snaps.map(s => ymLabel(s.id).replace(/^\d+年/, m => m)), datasets:[{label:'総資産', data:snaps.map(s => s.cash+s.invest),
      borderColor:C.invest, backgroundColor:C.invest, borderWidth:2, pointRadius:4, pointHoverRadius:6, pointBorderColor:C.card, pointBorderWidth:2, tension:.25}]},
    options:{interaction:{mode:'index', intersect:false}, plugins:{tooltip:{callbacks:{label:yenTip}}},
      scales:{x:{grid:{display:false}}, y:{ticks:{callback:manTick, maxTicksLimit:5}}}}});
}

  const t = totals(), C = COL(), H = S.data.holdings;
  const cats = [...new Set([...CATEGORY_ORDER.filter(c => H.some(h => h.category===c)), ...H.map(h => h.category)])];
  const catColors = [C.invest, C.c3, C.c4, C.cash, C.muted];

  const sorted = [...H].sort((a,b) => b.value - a.value);
  const pl = sum(H, h => h.value - h.cost), costT = sum(H, h => h.cost);
  $('#app').innerHTML = heroHTML() + `<main>
    <section class="card"><h2>カテゴリ別の構成</h2><p class="note">投資 ${man(t.invest)} の内訳</p>
      ${legendHTML(cats.map((c,i) => [catColors[Math.min(i,4)], `${c} ${pct(catVal[i]/(t.invest||1))}`]))}
      <div class="chart" style="height:210px"><canvas id="cCat" aria-label="カテゴリ別の構成"></canvas></div>
    </section>
    <section class="card"><h2>アセットアロケーション</h2>
      ${legendHTML([[C.cash,`現金 ${man(t.cash)}`],[C.invest,`投資 ${man(t.invest)}`]])}
      <div class="chart" style="height:180px"><canvas id="cAlloc" aria-label="現金と投資"></canvas></div>
    </section>
    <section class="card"><h2>銘柄ごとの評価額と取得金額</h2><p class="note">評価額の大きい順</p>

      <div class="chart" style="height:${Math.max(220, sorted.length*34 + 40)}px"><canvas id="cBars" aria-label="銘柄別の評価額と取得金額"></canvas></div>
    </section>
    <section class="card"><h2>保有銘柄一覧（${H.length}件）</h2>
      <table class="num"><thead><tr><th>銘柄</th><th>評価額</th><th>損益</th></tr></thead><tbody>
      ${sorted.map(h => { const g = h.value-h.cost, r = h.cost ? g/h.cost : 0; return `<tr>
        <td>${esc(h.name)}<div class="cat">${esc(h.category)}</div></td><td>${yen(h.value)}</td>
        <td class="${g>=0?'plus':'minus'}">${signed(g)}<div style="font-size:11px">${r>=0?'+':''}${(r*100).toFixed(1)}%</div></td></tr>`; }).join('')}
      </tbody><tfoot><tr><td>合計</td><td>${yen(t.invest)}</td><td class="${pl>=0?'plus':'minus'}">${signed(pl)}<div style="font-size:11px">${costT? ((pl/costT)>=0?'+':'') + (pl/costT*100).toFixed(1)+'%':''}</div></td></tr></tfoot></table>
    </section>
  </main>`;
  bindHero();
  donut('cCat', cats, catVal, cats.map((_,i) => catColors[Math.min(i,4)]));
  donut('cAlloc', ['現金','投資'], [t.cash, t.invest], [C.cash, C.invest]);
  mkChart('cBars', {type:'bar', data:{labels:sorted.map(h => h.name.replace(/\(.*?\)$/,'').slice(0,14)),
    datasets:[{label:'評価額', data:sorted.map(h=>h.value), backgroundColor:C.invest, borderRadius:4, barPercentage:.85, categoryPercentage:.7},
              {label:'取得金額', data:sorted.map(h=>h.cost), backgroundColor:C.muted, borderRadius:4, barPercentage:.85, categoryPercentage:.7}]},
    options:{indexAxis:'y', interaction:{mode:'index', intersect:false},
      plugins:{tooltip:{callbacks:{title:items => sorted[items[0].dataIndex].name, label:ctx => ` ${ctx.dataset.label}：${yen(ctx.parsed.x)}`}}},
      scales:{x:{ticks:{callback:manTick, maxTicksLimit:4}}, y:{grid:{display:false}, ticks:{autoSkip:false, font:{size:10.5}}}}}});
}

function viewTrend(){
  const C = COL(), a = S.data.assumptions, snaps = S.data.snapshots;
  // 年次：各年の最後の記録
  const byYear = {}; snaps.forEach(s => byYear[s.id.slice(0,4)] = s);
  const years = Object.keys(byYear).sort();
  // 予測
  const sid = startId(a), goalYears = num(a.goalYears) || 20, endId = addMonths(sid, goalYears*12);
  const labels = []; for (let id = sid; id <= endId; id = addMonths(id,1)) labels.push(id);
  const snapMap = Object.fromEntries(snaps.map(s => [s.id, s.cash+s.invest]));
  const startSnap = snaps.find(s => s.id === sid) || snaps[0];
  const startVal = startSnap ? startSnap.cash + startSnap.invest : totals().total;
  const N = labels.length - 1, goal = num(a.goal);
  const target = labels.map((_,i) => startVal + (goal - startVal) * i / N);
  const last = snaps[snaps.length-1];
  let p1 = [], p2 = [], endA = null, endB = null;
  if (last && last.id <= endId){
    const remain = monthsBetween(last.id, endId);
    const base = {id:last.id, cash:last.cash, invest:last.invest};
    const A = Object.fromEntries(project(a, base, remain, false).map(r => [r.id, r.total]));
    const B = Object.fromEntries(project(a, base, remain, true).map(r => [r.id, r.total]));
    A[last.id] = B[last.id] = last.cash + last.invest;
    p1 = labels.map(id => A[id] ?? null); p2 = labels.map(id => B[id] ?? null);
    endA = A[endId]; endB = B[endId];
  }
  $('#app').innerHTML = heroHTML() + `<main>
    <section class="card"><h2>将来予測と目標ライン</h2>
      <p class="note">${ymLabel(sid)}〜${ymLabel(endId)}。予測は最新の記録（${last ? ymLabel(last.id) : 'なし'}）から計算</p>
      ${legendHTML([[C.invest,'実績'],[C.target,'目標ライン','dash'],[C.c3,'予測（順調）'],[C.cash,'予測（波を考慮）']])}
      <div class="chart" style="height:260px"><canvas id="cProj" aria-label="将来予測と目標ライン"></canvas></div>
      <table class="num" style="margin-top:10px"><tbody>
        <tr><td>目標（${ymLabel(endId)}）</td><td>${man(goal)}</td></tr>
        <tr><td>予測（順調）</td><td class="${endA>=goal?'plus':'minus'}">${endA!=null?man(endA):'—'}</td></tr>
        <tr><td>予測（波を考慮）</td><td class="${endB>=goal?'plus':'minus'}">${endB!=null?man(endB):'—'}</td></tr>
      </tbody></table>
    </section>
    <section class="card"><h2>月次の資産推移（実績）</h2>
      ${legendHTML([[C.cash,'現金'],[C.invest,'投資']])}
      ${snaps.length ? '<div class="chart" style="height:220px"><canvas id="cMonthly" aria-label="月次の資産推移"></canvas></div>' : '<div class="empty">まだ記録がありません</div>'}
      <details class="tbl"><summary>表で見る</summary><table class="num"><thead><tr><th>月</th><th>現金</th><th>投資</th><th>合計</th></tr></thead><tbody>
      ${snaps.slice().reverse().map(s => `<tr><td>${ymLabel(s.id)}</td><td>${man(s.cash)}</td><td>${man(s.invest)}</td><td>${man(s.cash+s.invest)}</td></tr>`).join('')}
      </tbody></table></details>
    </section>
    <section class="card"><h2>年次の資産推移（実績）</h2><p class="note">各年の最後に記録した月の値</p>
      ${legendHTML([[C.cash,'現金'],[C.invest,'投資']])}
      ${years.length ? '<div class="chart" style="height:200px"><canvas id="cYearly" aria-label="年次の資産推移"></canvas></div>' : '<div class="empty">まだ記録がありません</div>'}
    </section>
  </main>`;
  bindHero();
  mkChart('cProj', {type:'line', data:{labels:labels.map(ymLabel), datasets:[
      {label:'実績', data:labels.map(id => snapMap[id] ?? null), borderColor:C.invest, backgroundColor:C.invest, borderWidth:2, pointRadius:3, spanGaps:false},
      {label:'目標ライン', data:target, borderColor:C.target, borderDash:[6,4], borderWidth:2, pointRadius:0},
      {label:'予測（順調）', data:p1, borderColor:C.c3, borderWidth:2, pointRadius:0},
      {label:'予測（波を考慮）', data:p2, borderColor:C.cash, borderWidth:2, pointRadius:0}]},
    options:{interaction:{mode:'index', intersect:false},
      plugins:{tooltip:{filter:i => i.parsed.y != null, callbacks:{label:ctx => ` ${ctx.dataset.label}：${man(ctx.parsed.y)}`}}},
      scales:{x:{grid:{display:false}, ticks:{maxTicksLimit:6, maxRotation:0, callback:function(v){ return this.getLabelForValue(v).replace(/\d+月$/,''); }}},
              y:{beginAtZero:true, ticks:{callback:manTick, maxTicksLimit:6}}}}});
  const stacked = (id, lbls, rows) => mkChart(id, {type:'bar', data:{labels:lbls, datasets:[
      {label:'現金', maxBarThickness:44, data:rows.map(r=>r.cash), backgroundColor:C.cash, borderColor:C.card, borderWidth:{top:2}, borderSkipped:false, borderRadius:0},
      {label:'投資', maxBarThickness:44, data:rows.map(r=>r.invest), backgroundColor:C.invest, borderColor:C.card, borderWidth:{bottom:2}, borderSkipped:false, borderRadius:{topLeft:4, topRight:4}}]},
    options:{interaction:{mode:'index', intersect:false},
      plugins:{tooltip:{callbacks:{label:ctx => ` ${ctx.dataset.label}：${yen(ctx.parsed.y)}`,
        footer:items => '合計：' + yen(items.reduce((s,i)=>s+i.parsed.y,0))}}},
      scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, ticks:{callback:manTick, maxTicksLimit:5}}}}});
  if (snaps.length) stacked('cMonthly', snaps.map(s => ymLabel(s.id).replace(/^(\d+)年/, (m,y) => y.slice(2)+'/').replace('月','')), snaps);
  if (years.length) stacked('cYearly', years.map(y => y+'年'), years.map(y => byYear[y]));
}

// ===== 月次入力 =====
function ensureDraft(){
  if (!S.draft) S.draft = {cash:S.data.cash.map(c => ({...c})), holdings:S.data.holdings.map(h => ({...h}))};
  return S.draft;
}
function viewInput(){
  const D = ensureDraft(), today = ym(new Date()), snaps = S.data.snapshots;
  const done = new Set(snaps.map(s => s.id));
  if (!S.inputMonth || S.inputMonth > today) S.inputMonth = today;
  const cur = S.inputMonth, latest = snaps.length ? snaps[snaps.length-1].id : '';
  const pastMode = latest && cur < latest;      // 最新の記録より前の月 → 合計だけ記録・修正
  const options = Array.from({length:24}, (_,i) => addMonths(today, -i));
  const year = cur.slice(0,4);
  const months = Array.from({length:12}, (_,i) => `${year}-${String(i+1).padStart(2,'0')}`);
  const cats = [...new Set([...CATEGORY_ORDER, ...D.holdings.map(h => h.category)])];
  const cashT = sum(D.cash, c => c.value), invT = sum(D.holdings, h => h.value);
  const snapCur = snaps.find(x => x.id === cur);
  const head = `<section class="card">
      <label class="set-row" style="padding:0 0 10px"><span class="lb"><b>何月分として記録するか</b><small>初期値は今月。入力を忘れた月もここで選べます</small></span>
        <select id="monthSel">${options.map(m => `<option value="${m}" ${m===cur?'selected':''}>${ymLabel(m)}${done.has(m)?' ✓':''}</option>`).join('')}</select></label>
      <div class="status ${done.has(cur)?'done':'todo'}">${done.has(cur)
        ? `<span>✓ ${ymLabel(cur)}分は記録済みです。もう一度押すと<b>上書き</b>されます（2件にはなりません）</span>`
        : `<span>● ${ymLabel(cur)}分はまだ記録されていません</span>`}</div>
      <div class="chips">${months.map(m => `<button type="button" class="chip ${done.has(m)?'on':''} ${m===cur?'now':''}" data-m="${m}" ${m>today?'disabled':''} style="border:0">${Number(m.slice(5))}月${done.has(m)?' ✓':''}</button>`).join('')}</div>
    </section>`;
  if (pastMode){
    $('#app').innerHTML = heroHTML() + `<main>${head}
      <section class="card"><h2>${ymLabel(cur)}分の合計を入力</h2>
        <p class="note">${ymLabel(latest)}より前の月なので、合計額だけを記録します。今の銘柄一覧や現金の内訳は変わりません。</p>
        <label class="set-row"><span class="lb">現金の合計</span><span class="yen"><input type="text" inputmode="numeric" id="pCash" value="${snapCur ? Math.round(snapCur.cash).toLocaleString('ja-JP') : ''}"></span></label>
        <label class="set-row"><span class="lb">投資の合計</span><span class="yen"><input type="text" inputmode="numeric" id="pInv" value="${snapCur ? Math.round(snapCur.invest).toLocaleString('ja-JP') : ''}"></span></label>
        <button class="btn gold" id="commitPast">${ymLabel(cur)}分として${snapCur?'上書き':'記録'}</button>
      </section></main>`;
    bindHero(); bindMonth();
    $('#commitPast').onclick = commitPast;
    return;
  }
  $('#app').innerHTML = heroHTML() + `<main>
    ${head}
    <section class="card"><h2>スクショから読み取る（SBI証券）</h2>
      <p class="note">アプリの「資産 → 保有一覧」（投資信託・国内株式）のスクショを選んでください。複数枚まとめて選べます。読み取りはこのスマホの中だけで行い、画像は外に送りません。</p>
      <input type="file" id="ocrFile" accept="image/*" multiple hidden>
      <button class="btn ghost" id="ocrBtn" type="button">スクショを選ぶ</button>
      <div id="ocrOut"></div>
    </section>
    <section class="card"><h2>現金</h2>
      <div id="cashList">${D.cash.map((c,i) => `<div class="row">
        <div class="nm"><span>${esc(c.label)} <small>${esc(c.owner)}</small></span><button class="del" data-delcash="${i}">削除</button></div>
        <div class="yen"><input type="text" inputmode="numeric" data-cash="${i}" value="${Math.round(c.value).toLocaleString('ja-JP')}" aria-label="${esc(c.owner+' '+c.label)}"></div></div>`).join('')}</div>
      <button class="btn ghost" id="addCash">＋ 現金の項目を追加</button>
      <div class="total-line num"><span>現金合計</span><span id="cashTotal">${yen(cashT)}</span></div>
    </section>
    <section class="card"><h2>投資（評価額・取得金額）</h2>
      ${cats.filter(c => D.holdings.some(h => h.category===c)).map(c => `<div class="group-h"><span>${esc(c)}</span></div>
        ${D.holdings.map((h,i) => h.category!==c ? '' : `<div class="row">
          <div class="nm"><span>${esc(h.name)}</span><button class="del" data-delh="${i}">削除</button></div>
          <div class="fields">
            <label class="f">評価額<div class="yen"><input type="text" inputmode="numeric" data-hv="${i}" value="${Math.round(h.value).toLocaleString('ja-JP')}"></div></label>
            <label class="f">取得金額<div class="yen"><input type="text" inputmode="numeric" data-hc="${i}" value="${Math.round(h.cost).toLocaleString('ja-JP')}"></div></label>
          </div></div>`).join('')}`).join('')}
      <button class="btn ghost" id="addHolding">＋ 銘柄を追加</button>
      <div class="total-line num"><span>投資合計</span><span id="invTotal">${yen(invT)}</span></div>
    </section>
    <section class="card">
      <div class="total-line num" style="font-size:16px"><span>総資産</span><span id="allTotal">${yen(cashT+invT)}</span></div>
      <button class="btn gold" id="commit">この内容で${ymLabel(cur)}分を${done.has(cur)?'上書き':'反映'}</button>
      ${S.dirty ? '<p class="note" style="margin-top:8px">※ 未反映の変更があります</p>' : ''}
    </section>
  </main>`;
  bindHero(); bindMonth();
  const upd = () => {
    const ct = sum(D.cash, c=>c.value), it = sum(D.holdings, h=>h.value);
    $('#cashTotal').textContent = yen(ct); $('#invTotal').textContent = yen(it); $('#allTotal').textContent = yen(ct+it);
  };
  $('#app').querySelectorAll('input[data-cash],input[data-hv],input[data-hc]').forEach(inp => {
    inp.addEventListener('focus', () => { inp.value = String(num(inp.value)); inp.select(); });
    inp.addEventListener('blur', () => { inp.value = Math.round(num(inp.value)).toLocaleString('ja-JP'); });
    inp.addEventListener('input', () => {
      const v = num(inp.value); S.dirty = true;
      if (inp.dataset.cash != null) D.cash[inp.dataset.cash].value = v;
      if (inp.dataset.hv != null) D.holdings[inp.dataset.hv].value = v;
      if (inp.dataset.hc != null) D.holdings[inp.dataset.hc].cost = v;
      upd();
    });
  });
  $('#app').querySelectorAll('[data-delh]').forEach(b => b.onclick = () => {
    const h = D.holdings[b.dataset.delh];
    if (!confirm(`「${h.name}」を一覧から削除しますか？（反映ボタンを押すまで保存されません）`)) return;
    D.holdings.splice(b.dataset.delh, 1); S.dirty = true; viewInput();
  });
  $('#app').querySelectorAll('[data-delcash]').forEach(b => b.onclick = () => {
    const c = D.cash[b.dataset.delcash];
    if (!confirm(`「${c.owner} ${c.label}」を削除しますか？（反映ボタンを押すまで保存されません）`)) return;
    D.cash.splice(b.dataset.delcash, 1); S.dirty = true; viewInput();
  });
  $('#addHolding').onclick = () => addHoldingForm(cats);

// 金額はすべて「今の価値（実質）」で入力・計算し、名目額はインフレ率で換算して表示する
const EXIT_DEFAULTS = {
  exitHusbandBirthYear:0, exitWifeBirthYear:0, exitRetireAge:60, exitEndAge:95, exitWifeRetireAge:null, exitWifeWorkIncome:null,
  exitMonthlyLiving:null, exitAnnualExtra:0,
  exitHusbandPension:0, exitHusbandPensionAge:65, exitWifePension:0, exitWifePensionAge:65,
  exitHusbandGross:null, exitWifeGross:null, exitHusbandWorkStart:22, exitWifeWorkStart:22, exitWageGrowth:0.01,
  exitPensionTaxRate:0.12, exitPensionSlide:0,
  exitWithdrawalRate:0.04, exitWithdrawTaxRate:0.10, exitInflation:0.02, exitBuffer:0,
};
const EXIT_FIELDS = [
  ['家族とリタイア', [
    ['exitHusbandBirthYear','夫の生まれ年','int','西暦 例：1990'], ['exitWifeBirthYear','妻の生まれ年','int','西暦'],
    ['exitRetireAge','夫のリタイア年齢','int'],
    ['exitWifeRetireAge','妻のリタイア年齢','int','初期値は夫と同じ年にリタイア'],
    ['exitWifeWorkIncome','夫のリタイア後も妻が働く間の手取り（月）','yen','初期値は設定の妻の手取り'],
    ['exitEndAge','何歳まで計算するか（夫）','int']]],
  ['老後の年間支出（今の価値）', [
    ['exitMonthlyLiving','毎月の生活費','yen','初期値は設定の「世帯 月次支出」'], ['exitAnnualExtra','年間の特別支出','yen','旅行・車・家電・帰省など']]],
  ['年金の概算（年収から）', [
    ['exitHusbandGross','夫の今の年収（額面）','yen','初期値は設定の手取り÷0.78で推定'],
    ['exitWifeGross','妻の今の年収（額面）','yen','同上'],
    ['exitHusbandWorkStart','夫が会社員になった年齢','int'], ['exitWifeWorkStart','妻が会社員になった年齢','int'],
    ['exitWageGrowth','昇給率（年・物価を除く）','pct','初期値1%']]],
  ['年金（ねんきん定期便があれば）', [
    ['exitHusbandPension','夫の年金（65歳・年額）','yen','ねんきんネットの試算の月額×12を入れるのが一番正確。薄い数字＝年収からの自動計算<span id="hEstHint"></span>'], ['exitHusbandPensionAge','夫の受給開始年齢','int','65より遅いと月0.7%増、早いと月0.4%減'],
    ['exitWifePension','妻の年金（65歳・年額）','yen','薄い数字＝年収からの自動計算<span id="wEstHint"></span>'], ['exitWifePensionAge','妻の受給開始年齢','int'],
    ['exitPensionTaxRate','年金から引かれる税・社会保険料','pct','概算10〜15%'],
    ['exitPensionSlide','年金の目減り（年あたり）','pct','物価に追いつかない分。0なら物価並みに増える想定']]],
  ['取り崩し・税・インフレ', [
    ['exitWithdrawalRate','取り崩し率（年）','pct','初期値4%'],
    ['exitWithdrawTaxRate','取り崩し時の税率（実効）','pct','NISAは0%。課税口座は利益に20.315%'],
    ['exitInflation','インフレ率（年）','pct']]],
  ['追加の余裕資金', [
    ['exitBuffer','余裕資金（一括で確保）','yen','介護・住宅修繕・緊急資金など']]],
];
function exitParams(a){
  const p = {};
  for (const k in EXIT_DEFAULTS){
    const v = a[k];
    p[k] = (v === undefined || v === null || v === '') ? EXIT_DEFAULTS[k] : num(v);
  }
  if (p.exitMonthlyLiving === null) p.exitMonthlyLiving = num(a.monthlyExpense);
  // 額面年収の初期値：手取り÷0.78（概算）
  if (p.exitHusbandGross === null) p.exitHusbandGross = Math.round((num(a.husbandIncome)*12 + num(a.bonus)*bonusMonths(a).length) / 0.78 / 10000) * 10000;
  const hb0 = p.exitHusbandBirthYear, wb0 = p.exitWifeBirthYear || hb0;
  if (p.exitWifeRetireAge === null) p.exitWifeRetireAge = hb0 ? hb0 + p.exitRetireAge - wb0 : p.exitRetireAge;
  if (p.exitWifeWorkIncome === null) p.exitWifeWorkIncome = num(a.wifeIncome);
  if (p.exitWifeGross === null) p.exitWifeGross = Math.round(num(a.wifeIncome)*12 / 0.78 / 10000) * 10000;
  return p;
}

// 年金の概算（2025年度の制度で計算。今の価値）
const PENSION = { basicFull:831700, rate:5.481/1000, annualCap:650000*12 + 1500000*2 };
// ↑ 標準報酬の上限（月65万円）＋賞与上限（150万円×2回）≒ 年1,080万円
function estimatePension(gross, birthYear, workStart, workEnd, growth){
  const nowAge = new Date().getFullYear() - birthYear;
  let total = 0, years = 0;
  for (let age = workStart; age < Math.min(workEnd, 70); age++){
    const g = Math.min(PENSION.annualCap, gross * Math.pow(1 + growth, age - nowAge));
    total += g; years++;
  }
  const employee = total * PENSION.rate;          // 報酬比例部分（老齢厚生年金）
  return {basic:PENSION.basicFull, employee, total:PENSION.basicFull + employee, years};
}
function startAgeFactor(age){
  const m = Math.round((age - 65) * 12);
  return m >= 0 ? 1 + 0.007 * Math.min(m, 120) : 1 + 0.004 * Math.max(m, -60);
}
function calcExit(a){
  const p = exitParams(a), now = new Date(), thisYear = now.getFullYear();
  const hb = p.exitHusbandBirthYear, wb = p.exitWifeBirthYear || hb;
  if (!hb) return {missing:true, p};
  const retireYear = hb + p.exitRetireAge;
  const yrs = Math.max(0, retireYear - thisYear);
  const E = p.exitMonthlyLiving * 12 + p.exitAnnualExtra;
  const wifeRetireAge = p.exitWifeRetireAge, wRetireYear = wb + wifeRetireAge;
  const hEst = estimatePension(p.exitHusbandGross, hb, p.exitHusbandWorkStart, p.exitRetireAge, p.exitWageGrowth);
  const wEst = estimatePension(p.exitWifeGross, wb, p.exitWifeWorkStart, wifeRetireAge, p.exitWageGrowth);
  const hBase = p.exitHusbandPension > 0 ? p.exitHusbandPension : hEst.total;
  const wBase = p.exitWifePension > 0 ? p.exitWifePension : wEst.total;
  const hPen = hBase * startAgeFactor(p.exitHusbandPensionAge), wPen = wBase * startAgeFactor(p.exitWifePensionAge);
  const pensionNet = y => {
    let s = 0;
    if (y - hb >= p.exitHusbandPensionAge) s += hPen;
    if (y - wb >= p.exitWifePensionAge) s += wPen;
    return s * (1 - p.exitPensionTaxRate) * Math.pow(1 - p.exitPensionSlide, Math.max(0, y - thisYear));
  };
  const fullYear = Math.max(retireYear, hb + p.exitHusbandPensionAge, wb + p.exitWifePensionAge, wRetireYear);
  const wifeWork = y => (y >= retireYear && y < wRetireYear) ? p.exitWifeWorkIncome * 12 : 0;
  const Pfull = pensionNet(fullYear);
  const G = Math.max(0, E - Pfull);                       // 年金がそろった後の毎年の不足
  const gross = 1 / (1 - Math.min(0.9, p.exitWithdrawTaxRate));
  const core = p.exitWithdrawalRate > 0 ? G / p.exitWithdrawalRate * gross : 0;
  let bridge = 0; const rows = [];
  for (let y = retireYear; y <= hb + p.exitEndAge; y++){
    const P = pensionNet(y), work = Math.min(wifeWork(y), Math.max(0, E - P)), need = Math.max(0, E - P - work);
    if (y < fullYear) bridge += Math.max(0, need - G) * gross;   // 空白期間に上乗せで必要な分
    rows.push({year:y, hAge:y-hb, wAge:y-wb, pension:Math.min(P, E), work, withdraw:need, bridge:y < fullYear});
  }
  const real = core + bridge + p.exitBuffer;
  const inf = Math.pow(1 + p.exitInflation, yrs);
  // 今の積立ペースでの予測（リタイア時点）
  const snaps = S.data.snapshots, last = snaps[snaps.length-1];
  const startM = (startId(a).slice(5) || '07');
  const retireId = `${retireYear}-${startM}`;
  let fA = totals().total, fB = fA;
  if (last){
    const m = monthsBetween(last.id, retireId), base = {id:last.id, cash:last.cash, invest:last.invest};
    fA = fB = last.cash + last.invest;
    if (m > 0){ fA = project(a, base, m, false).pop().total; fB = project(a, base, m, true).pop().total; }
  }
  // 不足を埋める追加積立（月額・名目、想定利回りで複利）
  const short = Math.max(0, real*inf - fB), n = Math.max(1, monthsBetween(ym(now), retireId));
  const r = Math.pow(1 + num(a.returnRate), 1/12) - 1;
  const extraMonthly = short > 0 ? (r > 0 ? short * r / (Math.pow(1+r, n) - 1) : short / n) : 0;
  return {p, E, Pfull, G, core, bridge, real, nominal:real*inf, inf, yrs, retireYear, fullYear,
    bridgeYears:Math.max(0, fullYear - retireYear), rows, wRetireYear, hEst, wEst, hPen, wPen,
    hSrc:p.exitHusbandPension > 0 ? '定期便' : '概算', wSrc:p.exitWifePension > 0 ? '定期便' : '概算', fA, fB, extraMonthly, hAge:thisYear-hb, wAge:thisYear-wb};
}

function drawExit(a){
  const old = S.charts.filter(c => c.canvas && c.canvas.id === 'cExit');
  S.charts = S.charts.filter(c => !old.includes(c));
  old.forEach(c => c.destroy());
  const r = calcExit(a), C = COL(), box = $('#exitResult');
  if (r.missing){
    box.innerHTML = `<section class="card"><h2>出口戦略</h2><p class="note">下の「夫の生まれ年」と「妻の生まれ年」を入れると、年収から年金を概算して、老後に必要な資産額を計算します。</p></section>`;
    return;
  }

// ===== スクショ読み取り（SBI証券アプリの保有一覧） =====
// 数字の候補を作る：カンマ/ピリオドの読み違い、末尾の「円」の読み違いに対応
function numCandidates(s){
  const out = new Set();
  // 左の列からはみ出した文字を避けるため、いちばん右の数字のかたまりだけを使う
  const toks = String(s).trim().split(/\s+/).filter(t => /[0-9]/.test(t));
  if (!toks.length) return [];
  const m = toks[toks.length-1].match(/[0-9][0-9.,]*[0-9]?/g);
  if (!m) return [];
  for (let raw of [m[m.length-1]]){
    for (const r of [raw, raw.slice(0,-1)]){       // 末尾1文字が「円」の読み違いの場合
      if (!/[0-9]/.test(r)) continue;
      const parts = r.split(/[.,]/);
      const n = parts.length - 1;
      for (let mask = 0; mask < (1 << Math.max(0,n)); mask++){
        // 各区切りを桁区切り(0)か小数点(1)とみなす。小数点は最後の1つだけ
        let ok = true, intPart = parts[0], dec = '';
        for (let i = 1; i <= n; i++){
          const isDec = (mask >> (i-1)) & 1;
          if (isDec){ if (i !== n || parts[i].length > 2 || parts[i].length < 1){ ok=false; break; } dec = parts[i]; }
          else { if (parts[i].length !== 3){ ok=false; break; } intPart += parts[i]; }
        }
        if (ok && intPart !== '') out.add(Number(intPart + (dec ? '.' + dec : '')));
      }
      if (n === 0) out.add(Number(r));
    }
  }
  return [...out].filter(v => Number.isFinite(v) && v > 0);
}
function plValue(s){
  const t = String(s).replace(/\s/g,'');
  const m = t.match(/([+\-−ー‐])?([0-9][0-9,.]*)/);
  if (!m) return null;
  // 桁区切りが正しい整数の読み方を選ぶ（末尾の「円」を1と読んだ場合も外す）
  const c = numCandidates(m[2]).filter(Number.isInteger).sort((x,y)=>y-x);
  if (!c.length) return null;
  return {abs:c[0], sign: m[1] ? (m[1]==='+' ? 1 : -1) : 0};
}
function rateValue(s){
  const m = String(s).replace(/\s/g,'').match(/([+\-−])?([0-9]+[.,][0-9]{1,2})[.,]?%/);
  return m ? {abs:Number(m[2].replace(',','.')), sign: m[1] ? (m[1]==='+'?1:-1) : 0} : null;
}
const CODE_RE = /^[0-9]{3}[0-9A-Z]$|^[0-9]{7}[0-9A-Z]$/;   // 株：2638・285A／投信：03311187・0331418A

// cols: {left,mid,right: [{y, text}]}, H: 画像の高さ
function parseSbi(cols, W){
  const sc = W / 1290;
  const anchors = cols.left.map(l => ({y:l.y, code:l.text.replace(/[^0-9A-Z]/g,'')}))
    .filter(a => CODE_RE.test(a.code))
    .filter((a, i, arr) => !(arr[i+1] && arr[i+1].y - a.y < 120*sc));   // すぐ下にもコードがあれば下を採用
  const rows = [];
  anchors.forEach((a, i) => {
    const lo = i ? anchors[i-1].y + 30*sc : a.y - 330*sc, hi = a.y + 30*sc;
    const mids = cols.mid.filter(l => l.y > lo && l.y <= hi && /[0-9]/.test(l.text)).sort((p,q)=>p.y-q.y);
    const rights = cols.right.filter(l => l.y > lo && l.y <= hi).sort((p,q)=>p.y-q.y);
    const plLine = rights.filter(l => !/%/.test(l.text) && /[0-9]/.test(l.text)).pop();
    const rateLine = rights.filter(l => /%/.test(l.text)).pop();
    if (!plLine || mids.length < 2) return;
    const [m0, m1] = mids.slice(-2);    // 銘柄コードの直前の2行＝現在値・取得単価
    const pl = plValue(plLine.text), rate = rateLine ? rateValue(rateLine.text) : null;
    if (!pl) return;
    // 現在値・取得単価の読み方の組み合わせから、損益率と合うものを選ぶ
    let best = null;
    for (const p of numCandidates(m0.text)) for (const u of numCandidates(m1.text)){
      if (p === u) continue;
      const r = Math.abs((p/u - 1) * 100);
      const err = rate ? Math.abs(r - rate.abs) : 0;
      // 株は数量が整数になるはず
      let qty = pl.abs / Math.abs(p - u);
      const isStock = a.code.length === 4;
      const intErr = isStock ? Math.abs(qty - Math.round(qty)) : 0;
      const score = err * 10 + intErr + (rate ? 0 : 1);
      if (!best || score < best.score) best = {score, p, u, err, intErr, qty};
    }
    if (!best) return;
    const isStock = a.code.length === 4;
    let qty = best.qty;
    if (isStock) qty = Math.max(1, Math.round(qty));
    const value = qty * best.p, cost = qty * best.u;
    const sure = (rate ? best.err <= 0.02 : false) && (!isStock || best.intErr < 0.05);
    rows.push({y:a.y, code:a.code, type:isStock?'stock':'fund', price:best.p, unit:best.u,
      pl:(best.p >= best.u ? 1 : -1) * pl.abs, rate:rate ? rate.abs : null,
      qty, value:Math.round(value), cost:Math.round(cost), sure});
  });
  // 画面上部の評価額合計（検算用）
  const firstY = rows.length ? rows[0].y - 330*sc : Infinity;
  const totalLine = cols.right.filter(l => l.y < firstY && /[0-9]{1,3}[,.][0-9]{3}/.test(l.text) && !/[%+\-]/.test(l.text) && !/[0-9]{3}\/|20[0-9]{2}[\/7]/.test(l.text))
    .sort((p,q)=>p.y-q.y)[0];
  let screenTotal = null;
  if (totalLine){ const c = numCandidates(totalLine.text).filter(Number.isInteger).sort((x,y)=>y-x); screenTotal = c[0] ?? null; }
  return {rows, screenTotal};
}

// ===== スクショ読み取り：画面まわり =====
const OCR_LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null;
function loadScript(src){ return new Promise((ok, ng) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => ng(new Error('読み取り用プログラムを取得できませんでした')); document.head.appendChild(el); }); }
async function getOcrWorker(){
  if (!window.Tesseract) await loadScript(OCR_LIB);
  if (!ocrWorker){
    ocrWorker = await Tesseract.createWorker('eng', 1);
    await ocrWorker.setParameters({ tessedit_char_whitelist:'0123456789,.+-()%円ABCDEFGHIJKLMNOPQRSTUVWXYZ', tessedit_pageseg_mode:'6' });
  }
  return ocrWorker;
}
async function ocrFile(file){
  const bmp = await createImageBitmap(file);
  const W = bmp.width, H = bmp.height; bmp.close && bmp.close();
  const w = await getOcrWorker(), cols = {};
  for (const [nm, a, b] of [['left',0,0.256],['mid',0.256,0.643],['right',0.643,1]]){
    const { data } = await w.recognize(file, { rectangle:{left:Math.round(a*W), top:0, width:Math.round((b-a)*W), height:H} });
    cols[nm] = data.lines.map(l => ({y:(l.bbox.y0 + l.bbox.y1)/2, text:l.text.trim()}));
  }
  return parseSbi(cols, W);
}
function ocrCodeMap(){ try { return JSON.parse(S.data.assumptions.ocrCodeMap || '{}') || {}; } catch(e){ return {}; } }
function matchOcrRows(rows, holdings){
  const map = ocrCodeMap(), used = new Set();
  rows.forEach(r => {
    let h = null;
    if (r.type === 'stock') h = holdings.find(x => x.id === 'h_' + r.code || String(x.name).includes('(' + r.code + ')'));
    if (!h && map[r.code]) h = holdings.find(x => x.id === map[r.code]);
    if (h){ r.target = h.id; used.add(h.id); }
  });
  rows.filter(r => !r.target && r.type === 'fund').forEach(r => {   // 初回の投信は評価額が近いものを候補に
    let best = null;
    holdings.filter(x => !used.has(x.id) && x.category !== '国内株式').forEach(x => {
      const d = Math.abs(x.value - r.value) / Math.max(x.value, r.value, 1);
      if (d < 0.35 && (!best || d < best.d)) best = {x, d};
    });
    if (best){ r.target = best.x.id; r.guessed = true; used.add(best.x.id); }
  });
  rows.forEach(r => { if (!r.target){ r.target = '__new'; r.newCat = r.type === 'stock' ? '国内株式' : '投資信託(成長)'; r.newName = ''; } });
}
async function runOcr(files){
  const out = $('#ocrOut'), D = ensureDraft();
  const all = [], checks = [];
  try {
    for (let i = 0; i < files.length; i++){
      out.innerHTML = `<p class="note"><span class="spin" style="display:inline-block;vertical-align:middle;width:14px;height:14px;border-width:2px"></span> 読み取り中 ${i+1}/${files.length}… ${!ocrWorker ? '（初回は準備に少し時間がかかります）' : ''}</p>`;
      const r = await ocrFile(files[i]);
      const sumV = r.rows.reduce((t, x) => t + x.value, 0);
      checks.push({n:i+1, count:r.rows.length, sum:sumV, screen:r.screenTotal});
      r.rows.forEach(x => { if (!all.some(y => y.code === x.code)) all.push(x); });
    }
  } catch(e){ out.innerHTML = `<p class="note minus">読み取りに失敗しました：${esc(e.message)}</p>`; return; }
  if (!all.length){ out.innerHTML = '<p class="note minus">銘柄を読み取れませんでした。SBI証券アプリの「保有一覧」の画面か確認してください。</p>'; return; }
  matchOcrRows(all, D.holdings);
  S.ocr = {rows:all, checks};
  renderOcr();
}
function renderOcr(){
  const out = $('#ocrOut'); if (!out || !S.ocr) return;
  const D = ensureDraft(), {rows, checks} = S.ocr;
  const opts = r => `<option value="__new" ${r.target==='__new'?'selected':''}>＋新しい銘柄として追加</option><option value="__skip" ${r.target==='__skip'?'selected':''}>使わない</option>` +
    D.holdings.map(h => `<option value="${esc(h.id)}" ${r.target===h.id?'selected':''}>${esc(h.name)}</option>`).join('');
  const seen = new Set(rows.filter(r => !r.target.startsWith('__')).map(r => r.target));
  const missing = D.holdings.filter(h => !seen.has(h.id));
  out.innerHTML = `
    ${checks.map(c => { const diff = c.screen != null ? c.screen - c.sum : null;
      const ok = diff != null && Math.abs(diff) <= Math.max(100, c.screen*0.001);
      return `<p class="note">${checks.length>1?`${c.n}枚目：`:''}${c.count}件を読み取り、合計 ${yen(c.sum)}${c.screen!=null ? `／画面の合計 ${yen(c.screen)} ` + (ok ? '<span class="plus">✓ 一致</span>' : `<span class="minus">差 ${yen(diff)}（画面の外の銘柄があれば、続きのスクショも追加してください）</span>`) : ''}</p>`; }).join('')}
    ${rows.map((r, i) => `<div class="row">
      <div class="nm"><span>${r.type==='stock'?'株':'投信'} ${esc(r.code)} ${r.sure ? '' : '<small class="minus">要確認</small>'}${r.guessed ? '<small>（評価額が近い銘柄を候補にしました）</small>' : ''}</span></div>
      <select data-ocr="${i}" class="left" style="margin-bottom:6px">${opts(r)}</select>
      ${r.target==='__new' ? `<div class="fields" style="margin-bottom:6px"><input type="text" class="left" data-ocrname="${i}" placeholder="銘柄名" value="${esc(r.newName||'')}">
        <select data-ocrcat="${i}" class="left">${[...new Set([...CATEGORY_ORDER, ...D.holdings.map(h=>h.category)])].map(c => `<option ${c===r.newCat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>` : ''}
      <div class="fields num" style="font-size:13px"><span>評価額 <b>${yen(r.value)}</b></span><span>取得金額 ${yen(r.cost)}</span></div>
    </div>`).join('')}
    ${missing.length ? `<p class="note">今回のスクショに無かった銘柄（前の値のまま）：${missing.map(h => esc(h.name)).join('、')}</p>` : ''}
    <button class="btn" id="ocrApply">この内容を入力欄に入れる</button>
    <p class="note" style="margin-top:6px">まだ保存はされません。入力欄を確認してから下の「反映」を押してください。</p>`;
  out.querySelectorAll('[data-ocr]').forEach(el => el.onchange = () => { const r = rows[el.dataset.ocr]; r.target = el.value; r.guessed = false;
    if (el.value === '__new'){ r.newCat = r.newCat || (r.type==='stock' ? '国内株式' : '投資信託(成長)'); r.newName = r.newName || ''; } renderOcr(); });
  out.querySelectorAll('[data-ocrname]').forEach(el => el.oninput = () => rows[el.dataset.ocrname].newName = el.value);
  out.querySelectorAll('[data-ocrcat]').forEach(el => el.onchange = () => rows[el.dataset.ocrcat].newCat = el.value);
  $('#ocrApply').onclick = applyOcr;
}
function applyOcr(){
  const D = ensureDraft(), map = ocrCodeMap(), month = S.inputMonth || ym(new Date());
  let n = 0;
  for (const r of S.ocr.rows){
    if (r.target === '__skip') continue;
    if (r.target === '__new'){
      if (!r.newName.trim()){ toast(`${r.code} の銘柄名を入れてください`, true); return; }
      const id = 'h_' + r.code;
      D.holdings.push({id, category:r.newCat, name:r.newName.trim() + (r.type==='stock' ? `(${r.code})` : ''), value:r.value, cost:r.cost, asOf:month});
      if (r.type === 'fund') map[r.code] = id;
    } else {
      const h = D.holdings.find(x => x.id === r.target); if (!h) continue;
      h.value = r.value; h.cost = r.cost;
      if (r.type === 'fund') map[r.code] = h.id;
    }

  }
  S.dirty = true; S.ocr = null;
  // 投信コードと銘柄の対応を覚えておく（次回から自動で当てはまる）
  const prev = S.data.assumptions.ocrCodeMap || '{}', next = JSON.stringify(map);
  if (next !== prev){
    S.data.assumptions.ocrCodeMap = next;
    apiPost({action:'saveAssumptions', data:S.data.assumptions}).catch(() => {});
  }
  viewInput();
  toast(`${n}件を入力欄に入れました。確認して「反映」を押してください`);
}
</script>
</body>
</html>
